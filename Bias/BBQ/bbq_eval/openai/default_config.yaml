# API keys come from the environment; do not put credentials in this file.
model:
  base_url: "https://integrate.api.nvidia.com/v1"
  model_name: "nvidia/nemotron-3.5-lightning-30b-a3b"
  timeout: 30
  max_retries: 2
  inference_parameters:
    top_p: 0.7
    temperature: 1.0
    tokens_to_generate: 1024
  # Parser defaults to the main model and endpoint when omitted.
  parser_inference_parameters:
    temperature: 0.0
    max_tokens: 1024
    top_p: 1.0
